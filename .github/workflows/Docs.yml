name: Docs

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  statuses: write

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build libfacil_julia
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. deps/build.jl
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      # Runs every program in docs/examples against a client and every doctest,
      # and fails on any warning. Deploys to gh-pages on pushes to main and on
      # tags; pull requests only build.
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia -t 4 --project=docs docs/make.jl
