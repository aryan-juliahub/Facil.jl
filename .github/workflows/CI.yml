name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        # macos-latest is arm64; macos-15-intel is the x86_64 image (macos-13 is retired).
        # ubuntu-24.04-arm is aarch64 Linux.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2

      - name: Brotli diagnostics
        if: runner.os == 'Linux' && runner.arch == 'ARM64' && matrix.julia != '1.10'
        continue-on-error: true
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          cat > "$RUNNER_TEMP/diag.jl" <<'EOF'
          using brotli_jll, Libdl
          println("enc ", string(@ccall(libbrotlienc.BrotliEncoderVersion()::UInt32), base = 16),
                  " dec ", string(@ccall(libbrotlidec.BrotliDecoderVersion()::UInt32), base = 16))
          println(brotli_jll.libbrotlidec_path)
          println(filter(contains("brotli"), Libdl.dllist()))
          function dec(src)
              s = @ccall libbrotlidec.BrotliDecoderCreateInstance(C_NULL::Ptr{Cvoid}, C_NULL::Ptr{Cvoid}, C_NULL::Ptr{Cvoid})::Ptr{Cvoid}
              buf = Vector{UInt8}(undef, 1 << 16)
              ai, ni = Ref{Csize_t}(length(src)), Ref{Ptr{UInt8}}(pointer(src))
              ao, no = Ref{Csize_t}(length(buf)), Ref{Ptr{UInt8}}(pointer(buf))
              r = GC.@preserve src buf @ccall libbrotlidec.BrotliDecoderDecompressStream(s::Ptr{Cvoid}, ai::Ptr{Csize_t}, ni::Ptr{Ptr{UInt8}}, ao::Ptr{Csize_t}, no::Ptr{Ptr{UInt8}}, C_NULL::Ptr{Csize_t})::Cint
              code = @ccall libbrotlidec.BrotliDecoderGetErrorCode(s::Ptr{Cvoid})::Cint
              msg = unsafe_string(@ccall libbrotlidec.BrotliDecoderErrorString(code::Cint)::Cstring)
              println("stream result ", r, " code ", code, " ", msg, " produced ", length(buf) - Int(ao[]), " left ", Int(ai[]))
              n = Ref{Csize_t}(length(buf))
              r2 = GC.@preserve src buf @ccall libbrotlidec.BrotliDecoderDecompress(length(src)::Csize_t, src::Ptr{UInt8}, n::Ptr{Csize_t}, buf::Ptr{UInt8})::Cint
              println("one-shot result ", r2, " n ", Int(n[]))
          end
          data = Vector{UInt8}("hello brotli "^20)
          good = hex2bytes("1b03010004d4c3ebed7d97b211ca2c068ce6d8042a5f9f15")
          println("known-good stream:"); dec(good)
          out = Vector{UInt8}(undef, 4096); n = Ref{Csize_t}(4096)
          ok = @ccall libbrotlienc.BrotliEncoderCompress(4::Cint, 22::Cint, 0::Cint, length(data)::Csize_t, data::Ptr{UInt8}, n::Ptr{Csize_t}, out::Ptr{UInt8})::Cint
          resize!(out, n[])
          println("encode ok ", ok, " ", bytes2hex(out), " same as macOS: ", out == good)
          println("own stream:"); dec(out)
          EOF
          julia --project=. "$RUNNER_TEMP/diag.jl"
          ls -l /usr/lib/aarch64-linux-gnu/libbrotli* || true
          # the same stream through the system decoder, in a process without brotli_jll
          julia -e 'using Libdl
            h = dlopen("libbrotlidec.so.1")
            src = hex2bytes("1b03010004d4c3ebed7d97b211ca2c068ce6d8042a5f9f15"); buf = zeros(UInt8, 4096); n = Ref{Csize_t}(4096)
            r = ccall(dlsym(h, :BrotliDecoderDecompress), Cint, (Csize_t, Ptr{UInt8}, Ptr{Csize_t}, Ptr{UInt8}), length(src), src, n, buf)
            println("system decoder: result ", r, " n ", Int(n[]), " version ", string(ccall(dlsym(h, :BrotliDecoderVersion), UInt32, ()), base = 16))'
          cat > "$RUNNER_TEMP/d.c" <<'EOF'
          #include <stdio.h>
          #include <stddef.h>
          #include <stdint.h>
          int BrotliDecoderDecompress(size_t, const uint8_t *, size_t *, uint8_t *);
          int main(void) {
            static const uint8_t s[] = {0x1b,0x03,0x01,0x00,0x04,0xd4,0xc3,0xeb,0xed,0x7d,0x97,0xb2,0x11,0xca,0x2c,0x06,0x8c,0xe6,0xd8,0x04,0x2a,0x5f,0x9f,0x15};
            uint8_t out[4096]; size_t n = sizeof(out);
            int r = BrotliDecoderDecompress(sizeof(s), s, &n, out);
            printf("C program: result %d n %zu\n", r, n);
            return 0;
          }
          EOF
          A=$(dirname "$(julia --project=. -e 'using brotli_jll; print(brotli_jll.libbrotlidec_path)')")
          cc "$RUNNER_TEMP/d.c" -o "$RUNNER_TEMP/d_jll" -L"$A" -lbrotlidec -Wl,-rpath,"$A" && echo "JLL library from C:" && "$RUNNER_TEMP/d_jll"
          cc "$RUNNER_TEMP/d.c" -o "$RUNNER_TEMP/d_sys" -l:libbrotlidec.so.1 && echo "system library from C:" && "$RUNNER_TEMP/d_sys"

      # Julia >= 1.11 reads [sources] in Project.toml, so the repo project works as is.
      - name: Build libfacil_julia
        if: matrix.julia != '1.10'
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. deps/build_local.jl --verbose
      - name: Test HttpTypes
        if: matrix.julia != '1.10'
        run: julia --project=lib/HttpTypes -e 'using Pkg; Pkg.test()'
      - name: Test Facil
        if: matrix.julia != '1.10'
        run: julia -t 4 --project=. -e 'using Pkg; Pkg.test()'

      # Julia 1.10 ignores [sources]: develop both packages into a scratch environment.
      # Precompiling Facil builds the library.
      - name: Build and test (Julia 1.10, developed environment)
        if: matrix.julia == '1.10'
        run: |
          julia --project=ci110 -e '
            using Pkg
            Pkg.develop([PackageSpec(path="lib/HttpTypes"), PackageSpec(path=".")])
            Pkg.test("HttpTypes")
            using Facil
            println(Facil.fjl_build_id())'
          julia -t 4 --project=ci110 -e 'using Pkg; Pkg.test("Facil")'

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-julia-${{ matrix.julia }}
          path: |
            deps/build/**/*.log
            ~/.julia/scratchspaces/**/build/**/*.log
            ~/.julia/logs/
          if-no-files-found: ignore

  # facil.io has no Windows port, so Windows tests HttpTypes alone and checks that
  # building or loading Facil stops with the WSL2 message.
  httptypes-windows:
    name: HttpTypes - Julia ${{ matrix.julia }} - windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Test HttpTypes
        run: julia --project=lib/HttpTypes -e 'using Pkg; Pkg.test()'
      - name: Facil fails with the WSL2 message
        if: matrix.julia != '1.10'
        shell: bash
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          ! julia --project=. deps/build_local.jl > build.log 2>&1
          grep -q 'on Windows use WSL2' build.log || { cat build.log; exit 1; }
          ! julia --project=. -e 'using Facil' > load.log 2>&1
          grep -q 'on Windows use WSL2' load.log || { cat load.log; exit 1; }

  # The patch suites drive the merged facil.io objects directly; on Linux they are
  # the only run of the epoll, sendfile and timerfd paths.
  patches-linux:
    name: facil.io patch suites - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev lsof curl python3 openssl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install node modules
        run: |
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          npm init -y >/dev/null && npm install ws@8
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Fetch OpenSSL headers
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          deps/fetch_facil.sh
          julia --project=. deps/build_local.jl
          h=$(find deps/build "$HOME/.julia/artifacts" -path '*/include/openssl/opensslv.h' 2>/dev/null | head -1)
          echo "OPENSSL=$(dirname "$(dirname "$(dirname "$h")")")" >> "$GITHUB_ENV"
      - name: Run suites (robust, upload, ws, tls, fdreuse)
        run: |
          export NODE_MODULES="$RUNNER_TEMP/node/node_modules"
          test/patches/run.sh "$RUNNER_TEMP/patches" robust upload ws tls fdreuse
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-suites-linux
          path: ${{ runner.temp }}/patches
          if-no-files-found: ignore
