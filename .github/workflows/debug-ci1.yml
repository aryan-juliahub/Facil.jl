name: debug-ci1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    name: dbg ${{ matrix.v }} ${{ matrix.mode }} t${{ matrix.t }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: ['1.10', '1.11']
        mode: [vector, string, inline, nogc]
        t: ['4']
        include:
          - {v: '1.10', mode: vector, t: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.v }}
      - uses: julia-actions/cache@v2
      - run: |
          julia --project=ci110 -e 'using Pkg; Pkg.develop([PackageSpec(path="lib/HttpTypes"), PackageSpec(path=".")]); Pkg.build("Facil")'
      - name: run
        run: |
          for i in 1 2; do
            julia -t ${{ matrix.t }} --project=ci110 .github/debug-ci1/repro.jl ${{ matrix.mode }} 2>&1 | grep -vE '^ +(@|\[)' | grep -vE '^(jl_|ijl_|_jl|eval|do_call|jfptr|unknown function)' | tail -40
            echo "== iteration $i exit ${PIPESTATUS[0]}"
          done
